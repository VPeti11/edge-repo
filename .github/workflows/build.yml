name: Update and Mirror staging edge-repo

on:
  schedule:
    - cron: "0 5 * * 5"  # Every Friday at 5:00 AM
  workflow_dispatch:

jobs:
  aur-install:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Create non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/aurbuild
          chown -R builder:builder /home/builder

      - name: Install base-devel and git
        run: pacman -Sy --noconfirm base-devel git jq

      - name: Clone yay-bin from AUR
        run: su - builder -c 'curl -o PKGBUILD https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=yay'

      - name: Build and install yay
        run: |
          su - builder -c 'cd /home/builder/ && makepkg -si --noconfirm'

      - name: Install AUR packages with fallback
        run: |
          PACKAGES=(
            lutris-git opengamepadui-git bottles gzdoom yay
            antimicrox-git ventoy-bin coolercontrol betterdiscord-installer
            moonlight-qt-git peazip polychromatic-git protonup-qt sunshine-beta-bin linux-firmware-valve
          )
      
          mkdir -p /home/builder/artifacts /home/builder/aurbuild
      
          for pkg in "${PACKAGES[@]}"; do
            echo "Installing $pkg with dependencies..."
            if ! su - builder -c "yay --noconfirm --save --builddir /home/builder/aurbuild -S $pkg"; then
              echo "Build failed for $pkg, attempting fallback..."
      
              URL=$(curl -s "https://api.github.com/repos/VPeti11/edge-repo/contents/x86_64?ref=staging" | \
                jq -r ".[] | select(.name | test(\"^${pkg}-.*\\\\.pkg\\\\.tar\\\\.zst$\")) | .download_url" | head -n 1)
      
              if [ -n "$URL" ]; then
                echo "Downloading fallback package from $URL"
                wget -P /home/builder/aurbuild "$URL"
              else
                echo "No fallback package found for $pkg"
                exit 100
              fi
            fi
          done
      
          find /home/builder/aurbuild -type f -name "*.pkg.tar.zst" ! -name "*-debug-*.pkg.tar.zst" -exec cp --dereference {} /home/builder/artifacts/ \;


      - name: Sanitize and rename packages
        run: |
          cd /home/builder/artifacts
          shopt -s nullglob
          for f in *.pkg.tar.zst; do
            base=$(echo "$f" | sed 's/-[^-]*-[^-]*\.pkg\.tar\.zst$//')
            safe=$(echo "$base.pkg.tar.zst" | sed 's/[:<>\"|?*]/_/g')
            if [ "$f" != "$safe" ]; then
              echo "Renaming $f -> $safe"
              mv "$f" "$safe"
            fi
          done

      - name: Upload AUR packages
        uses: actions/upload-artifact@v4
        with:
          name: aur-packages
          path: /home/builder/artifacts/*.pkg.tar.zst

  update-repo:
    runs-on: ubuntu-latest
    needs: aur-install
    container:
      image: archlinux:latest

    steps:
      - name: Install required packages
        run: pacman -Sy --noconfirm pacman-contrib gnupg

      - name: Download AUR packages
        uses: actions/download-artifact@v4
        with:
          name: aur-packages
          path: ./x86_64

      - name: Import GPG private key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Trust GPG key
        run: echo "53407B947EBAD024A4645885A139E9B289DC7527:6:" | gpg --import-ownertrust

      - name: Generate repo database
        run: |
          cd x86_64
          repo-add -s -k 53407B947EBAD024A4645885A139E9B289DC7527 edge-repo.db.tar.gz *.pkg.tar.zst

          unlink edge-repo.db
          unlink edge-repo.db.sig
          unlink edge-repo.files
          unlink edge-repo.files.sig
          mv edge-repo.db.tar.gz edge-repo.db
          mv edge-repo.db.tar.gz.sig edge-repo.db.sig
          mv edge-repo.files.tar.gz.sig edge-repo.files.sig
          mv edge-repo.files.tar.gz edge-repo.files

      - name: Sign packages
        run: |
          for pkg in ./x86_64/*.pkg.tar.zst; do
            gpg --armor --detach-sign --local-user 53407B947EBAD024A4645885A139E9B289DC7527 "$pkg"
          done

      - name: Rename .asc to .sig
        run: |
          cd x86_64
          for file in *.asc; do
            if [ -f "$file" ]; then
              mv "$file" "${file%.asc}.sig"
            fi
          done

      - name: Upload artifacts for push
        uses: actions/upload-artifact@v4
        with:
          name: repo-artifacts
          path: ./x86_64

  push-repo:
    runs-on: ubuntu-latest
    needs: update-repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Remove existing x86_64 folder
        run: rm -rf ./x86_64

      - name: Download built repo artifacts
        uses: actions/download-artifact@v4
        with:
          name: repo-artifacts
          path: ./x86_64

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          rm -f x86_64/linux-firmware-neptune*
          git add x86_64/*
          git commit -m "Update repo with signed packages" || echo "No changes to commit"
          git push origin staging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror:
    runs-on: ubuntu-latest
    needs: push-repo

    steps:
    - name: Always checkout GitHub staging branch
      uses: actions/checkout@v3
      with:
        ref: staging

    - name: Extract latest GitHub commit message
      id: commit_info
      run: |
        echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
        git log -1 --pretty=format:'%B' >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Set up Git config with Mirror Bot identity
      run: |
        git config --global user.name "GitLab Mirror Bot"
        git config --global user.email "mirror-bot@edgedev1.gitlab"

    - name: Clone GitLab repo and push to staging branch
      env:
        GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      run: |
        git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/edgedev1/edge-repo.git gitlab-mirror
        cd gitlab-mirror

        # Check out or create 'staging' branch
        if git ls-remote --exit-code --heads origin staging; then
          git checkout staging
        else
          git checkout -b staging
        fi

        cd ..
        rsync -av x86_64/ gitlab-mirror/x86_64/
        cd gitlab-mirror

        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "${{ steps.commit_info.outputs.commit_msg }}"
          git push origin staging
        fi
